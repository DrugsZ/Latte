name: Feature request
description: Propose a new feature or architectural capability.
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or developer problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Latte do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Figma-like editing semantics
        - VSCode-like platform/plugin API
        - Worker/data kernel
        - Rendering/hit testing
        - UI/workbench
        - Documentation/governance
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional, but useful for architecture proposals.
  - type: textarea
    id: notes
    attributes:
      label: Additional context
